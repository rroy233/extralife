name: Publish to npm and create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # Keep the existing release policy: prerelease versions are not published.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global 'npm@^11.5.1'

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Build project
        run: npm run build --if-present

      - name: Run tests
        run: npm test

      - name: Build npm tarball
        id: package
        run: |
          npm pack --json > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';

          const [packed] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-pack.json`, 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (packed.name !== pkg.name || packed.version !== pkg.version) {
            throw new Error('npm pack metadata does not match package.json');
          }
          for (const key of ['filename', 'integrity', 'name', 'version']) {
            if (typeof packed[key] !== 'string' || packed[key].length === 0) {
              throw new Error(`npm pack did not return ${key}`);
            }
          }
          console.log('tarball=' + packed.filename);
          console.log('integrity=' + packed.integrity);
          console.log('name=' + packed.name);
          console.log('version=' + packed.version);
          NODE

      - name: Publish package to npm
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          PACKAGE_INTEGRITY: ${{ steps.package.outputs.integrity }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          PUBLISHED_INTEGRITY="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.integrity 2>/dev/null || true)"
          if [ -n "$PUBLISHED_INTEGRITY" ]; then
            if [ "$PUBLISHED_INTEGRITY" != "$PACKAGE_INTEGRITY" ]; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists with different contents" >&2
              exit 1
            fi
            echo "This exact package version is already published; skipping npm publish."
          else
            npm publish "./$PACKAGE_TARBALL" --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" "./$PACKAGE_TARBALL" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
